<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111016"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>My Decks</title>
<style>
:root{--bg:#111016;--panel:#1d1922;--panel2:#29232f;--text:#f6f2f8;--muted:#b1a8ba;--accent:#c9a9ff;--line:#443a4d;--danger:#5a3039}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#30243c,#111016 55%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{border:0;border-radius:13px;padding:12px 15px;background:var(--accent);color:#19131f;font-weight:700;cursor:pointer}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--muted);padding:8px}button.danger{background:var(--danger);color:#ffe2e5}button:disabled{opacity:.4}.app{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}.top,.sectionhead,.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px}.top{margin-bottom:24px}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#c9a9ff,#7a62a6);display:grid;place-items:center;color:#1a1222;font-size:22px}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.sectionhead{margin:12px 0}.sectionhead h2{font-size:21px;margin:0}.deckgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;cursor:pointer;min-height:155px}.cover{height:105px;background:linear-gradient(135deg,#49375f,#201b27);display:grid;place-items:center;font-size:40px}.cover img{width:100%;height:100%;object-fit:cover}.deckinfo{padding:11px}.deckname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:12px;color:var(--muted);margin-top:3px}.empty{border:1px dashed var(--line);border-radius:16px;padding:27px;text-align:center;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--text);margin-bottom:5px}.screen{display:none}.screen.active{display:block}.backrow{display:flex;align-items:center;gap:8px;margin-bottom:14px}.hero{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:15px}.hero h2{margin:0 0 4px}.hero p{margin:0;color:var(--muted);font-size:13px}.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.controls button{padding:8px 10px;font-size:12px;border-radius:10px}.decktools{margin-top:22px;padding:13px}.decktools h2{font-size:18px}.decktools .controls button{padding:7px 9px;font-size:11.5px}.hero.decktools{opacity:.96}.drawarea{text-align:center}.drawarea>.eyebrow{margin:4px 0 10px}.stage{height:min(65vh,560px);min-height:300px;display:flex;justify-content:center;align-items:center}.stage.hidden{display:none}.resultsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:10px 0 18px}.resultcard{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;cursor:pointer;text-align:left}.resultcard img{width:100%;height:clamp(210px,42vw,360px);object-fit:contain;background:#100e13;display:block}.resultbody{padding:10px}.resultbody strong{display:block;font-size:14px}.resultbody p{margin:4px 0 0;color:var(--muted);font-size:12px;white-space:pre-wrap}.resulthint{font-size:12px;color:var(--muted);margin:4px 0 8px}.viewer{position:fixed;inset:0;background:#09070b;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(15px + env(safe-area-inset-top)) 12px calc(15px + env(safe-area-inset-bottom))}.viewer.open{display:flex}.viewer img{max-width:100%;max-height:82vh;object-fit:contain}.viewer .viewcaption{max-width:100%;text-align:center;padding:10px;color:var(--text)}.viewer .closeview{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px}.card{position:relative;width:min(76vw,310px);height:100%;max-height:430px;border:1px solid #645575;border-radius:20px;overflow:hidden;background:linear-gradient(145deg,#40324e,#17141b);box-shadow:0 22px 55px #0008;display:flex;align-items:center;justify-content:center}.card img{width:100%;height:100%;object-fit:contain;background:#100e13}.back{font-size:74px;color:#c7b5de}.caption{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000c);padding:25px 14px 14px;text-align:left}.caption h3{margin:0;font-size:19px}.caption p{margin:5px 0 0;font-size:13px;white-space:pre-wrap}.drawcontrols{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.drawcontrols button{min-width:75px}.rowline{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap}.toggle{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}.toggle input{accent-color:var(--accent)}.field{margin:13px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#121016;color:var(--text)}.field textarea{min-height:80px;resize:vertical}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:4}.modal.open{display:flex}.sheet{background:#1e1924;border:1px solid var(--line);width:min(100%,620px);border-radius:22px 22px 0 0;padding:19px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.sheethead h2{margin:0;font-size:20px}.cardlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:12px}.mini{background:var(--panel2);border:1px solid var(--line);border-radius:13px;overflow:hidden}.mini img{width:100%;aspect-ratio:2/3;object-fit:contain;background:#100e13}.mini-body{padding:8px}.mini-body input,.mini-body textarea{width:100%;margin:3px 0 6px;background:#141119;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px;font-size:13px}.mini-body textarea{min-height:55px}.mini-actions{display:flex;gap:5px}.mini-actions button{flex:1;padding:8px;font-size:12px}.history{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}.history h3{font-size:14px}.histitems{display:flex;gap:8px;overflow:auto}.histitem{min-width:70px;max-width:70px}.histitem img{width:70px;height:90px;object-fit:cover;border-radius:9px}.histitem div{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.notice{font-size:12px;color:var(--muted);margin-top:8px}.screen#home .controls button{font-size:11.5px;padding:8px 10px;border-radius:10px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#2c2533;border:1px solid var(--line);padding:11px 16px;border-radius:12px;display:none;z-index:9;max-width:90%;text-align:center}.toast.show{display:block}@media(min-width:600px){.app{padding-top:30px}.modal{align-items:center}.sheet{border-radius:22px}}
</style></head><body><div class="app">
<header class="top"><div class="brand"><div class="logo">✦</div><div><h1>My Decks</h1><p>My rules.</p></div></div><button id="newDeck" aria-label="Create deck">＋ New deck</button></header>
<section id="home" class="screen active"><div class="eyebrow">Your collection</div><div class="sectionhead"><h2>My Decks</h2><span class="eyebrow" id="deckCount"></span></div><div id="deckGrid" class="deckgrid"></div><div class="controls"><button class="secondary" id="backupAll">📦 Backup all decks</button><button class="secondary" id="importAll">📥 Import backup</button><button class="secondary" id="exportAll">⬇ Export collection</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><div class="notice">Decks are saved privately in this browser on this device. Back up regularly to move or protect them.</div></section>
<section id="deckScreen" class="screen"><div class="backrow"><button class="secondary" id="homeBtn">← Decks</button><span class="eyebrow">Deck</span></div><div class="drawarea"><div class="eyebrow" id="drawStatus">Ready</div><div class="stage" id="drawStage"><div class="card" id="drawCard"><div class="back">✦</div></div></div><div id="drawResults"></div><div class="drawcontrols"><button id="draw1">Draw 1</button><button class="secondary" id="draw3">Draw 3</button><button class="secondary" id="draw5">Draw 5</button></div><div class="field" style="max-width:240px;margin:10px auto"><label>Custom draw amount</label><div class="rowline"><input id="customAmount" type="number" min="1" value="2" style="width:95px"><button class="secondary" id="drawCustom">Draw</button></div></div><div class="rowline"><label class="toggle"><input id="noRepeat" type="checkbox" checked> No repeats until deck runs out</label><button class="secondary" id="resetDraw">↻ Reset / shuffle</button></div><div class="notice" id="drawNotice"></div></div><div class="history"><h3>Recent draws</h3><div id="historyItems" class="histitems"></div></div><div class="hero decktools"><h2 id="deckTitle"></h2><p id="deckMeta"></p><div class="controls"><button class="secondary" id="manageCards">Manage cards</button><button class="secondary" id="uploadCardBack">🎴 Upload card back</button><button class="secondary" id="removeCardBack">Remove card back</button><input id="cardBackFile" type="file" accept="image/*" hidden><button class="secondary" id="editDeck">Edit deck</button><button class="secondary" id="duplicateDeck">Duplicate</button><button class="secondary" id="backupDeck">Backup deck</button><button class="secondary" id="deleteDeck">Delete deck</button></div></div></section>
</div>
<div class="modal" id="deckModal"><div class="sheet"><div class="sheethead"><h2 id="deckModalTitle">Create deck</h2><button class="ghost" id="closeDeckModal">✕</button></div><div class="field"><label>Deck name</label><input id="deckName" placeholder="e.g. Daily Inspiration"></div><div class="field"><label>Cover image (optional)</label><input id="coverFile" type="file" accept="image/*"></div><div class="controls"><button id="saveDeck">Save deck</button><button class="secondary" id="cancelDeck">Cancel</button></div></div></div>
<div class="modal" id="cardsModal"><div class="sheet"><div class="sheethead"><h2>Manage cards</h2><button class="ghost" id="closeCards">✕</button></div><div class="field"><label>Add image cards (select multiple)</label><input id="cardFiles" type="file" accept="image/*" multiple></div><p class="notice">Images are kept on this device. You can edit a card's title and description below.</p><div id="cardList" class="cardlist"></div><div class="controls"><button id="doneCards">Done</button></div></div></div>
<div class="viewer" id="cardViewer"><button class="secondary closeview" id="closeViewer">✕ Close</button><img id="viewerImage" alt="Enlarged card"><div class="viewcaption" id="viewerCaption"></div></div><div class="toast" id="toast"></div>
<script>
const DB='randomDeckApp_v2';let decks=[],currentId=null,editingId=null,drawnIds=[],history=[];let dbPromise;
function db(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>req.result.createObjectStore('data');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}
async function load(){try{const d=await db();decks=await new Promise((res,rej)=>{let tx=d.transaction('data','readonly'),r=tx.objectStore('data').get('decks');r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});renderHome()}catch(e){toast('Storage unavailable. Please open in Safari or a supported browser.')}}
async function save(){try{const d=await db();await new Promise((res,rej)=>{let tx=d.transaction('data','readwrite');tx.objectStore('data').put(decks,'decks');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return true}catch(e){toast('Save failed: '+e.message);return false}}
function id(){return 'd-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2800)}function current(){return decks.find(d=>d.id===currentId)}function showScreen(x){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(x).classList.add('active')}
function renderHome(){const g=document.getElementById('deckGrid');document.getElementById('deckCount').textContent=`${decks.length} deck${decks.length===1?'':'s'}`;g.innerHTML='';if(!decks.length){g.innerHTML='<div class="empty"><strong>No decks yet</strong>Create your first deck and add card images.</div>';return}decks.forEach(d=>{const el=document.createElement('div');el.className='tile';const cover=document.createElement('div');cover.className='cover';if(d.cover){const img=document.createElement('img');img.src=d.cover;cover.append(img)}else cover.textContent='✦';const info=document.createElement('div');info.className='deckinfo';info.innerHTML='<div class="deckname"></div><div class="meta"></div>';info.querySelector('.deckname').textContent=d.name;info.querySelector('.meta').textContent=`${d.cards.length} cards`;el.append(cover,info);el.onclick=()=>openDeck(d.id);g.append(el)})}
function openDeck(id){currentId=id;drawnIds=[];history=[];backCard();document.getElementById('drawStage').classList.remove('hidden');document.getElementById('drawResults').innerHTML='';renderDeck();showScreen('deckScreen')}function renderDeck(){const d=current();if(!d)return;document.getElementById('deckTitle').textContent=d.name;document.getElementById('deckMeta').textContent=`${d.cards.length} cards · stored on this device`;document.getElementById('drawStatus').textContent=d.cards.length?'Ready to draw':'Add cards to begin';document.getElementById('drawNotice').textContent=document.getElementById('noRepeat').checked?`${Math.max(0,d.cards.length-drawnIds.length)} cards remaining before reset.`:'';document.getElementById('draw1').disabled=!d.cards.length;document.getElementById('draw3').disabled=d.cards.length<3;document.getElementById('draw5').disabled=d.cards.length<5;renderHistory()}
function backCard(){const c=document.getElementById('drawCard');c.innerHTML='';const d=current();if(d&&d.cardBack){const img=document.createElement('img');img.src=d.cardBack;img.alt='Card back';img.style.objectFit='cover';c.append(img)}else{const mark=document.createElement('div');mark.className='back';mark.textContent='✦';c.append(mark)}document.getElementById('drawStage').classList.remove('hidden');document.getElementById('drawResults').innerHTML=''}
function showViewer(card){const v=document.getElementById('cardViewer');const im=document.getElementById('viewerImage');im.src=card.image;im.alt=card.name||'Card';const cap=document.getElementById('viewerCaption');cap.textContent=[card.name,card.description].filter(Boolean).join(' — ');v.classList.add('open')}
function draw(n){const d=current();if(!d||!d.cards.length)return;const nr=document.getElementById('noRepeat').checked;let pool=nr?d.cards.filter(c=>!drawnIds.includes(c.id)):d.cards.slice();if(!pool.length){drawnIds=[];pool=d.cards.slice();toast('Deck exhausted—starting a new round.')}const count=Math.min(Math.max(1,n),pool.length),chosen=[];for(let i=0;i<count;i++){let ix=Math.floor(Math.random()*pool.length);chosen.push(pool.splice(ix,1)[0])}if(nr)drawnIds.push(...chosen.map(c=>c.id));history.unshift(...chosen);history=history.slice(0,40);const c=document.getElementById('drawCard'),results=document.getElementById('drawResults'),stage=document.getElementById('drawStage');results.innerHTML='';if(chosen.length===1){stage.classList.remove('hidden');c.innerHTML='';let card=chosen[0];let img=document.createElement('img');img.src=card.image;img.alt=card.name||'Drawn card';img.onclick=()=>showViewer(card);img.style.cursor='zoom-in';c.append(img);if(card.name||card.description){const cap=document.createElement('div');cap.className='resultbody singlecaption';cap.style.textAlign='center';cap.style.maxWidth='min(76vw,310px)';cap.style.margin='8px auto 0';const h=document.createElement('strong');h.textContent=card.name||'';h.style.fontSize='18px';const p=document.createElement('p');p.textContent=card.description||'';cap.append(h,p);results.append(cap)}document.getElementById('drawStatus').textContent='Card drawn'}else{stage.classList.add('hidden');const title=document.createElement('div');title.className='eyebrow';title.textContent=`${chosen.length} cards drawn · Tap a card to enlarge`;results.append(title);const grid=document.createElement('div');grid.className='resultsgrid';chosen.forEach(card=>{const item=document.createElement('div');item.className='resultcard';item.onclick=()=>showViewer(card);const im=document.createElement('img');im.src=card.image;im.alt=card.name||'Drawn card';const body=document.createElement('div');body.className='resultbody';const name=document.createElement('strong');name.textContent=card.name||'Card';body.append(name);if(card.description){const desc=document.createElement('p');desc.textContent=card.description;body.append(desc)}item.append(im,body);grid.append(item)});results.append(grid);document.getElementById('drawStatus').textContent=`${chosen.length} cards drawn`}renderDeck()}
function renderHistory(){const h=document.getElementById('historyItems');h.innerHTML='';if(!history.length){h.innerHTML='<span class="notice">Drawn cards will appear here.</span>';return}history.forEach(card=>{const el=document.createElement('div');el.className='histitem';const img=document.createElement('img');img.src=card.image;const t=document.createElement('div');t.textContent=card.name||'Card';el.append(img,t);h.append(el)})}
function openDeckModal(edit=false){editingId=edit?currentId:null;document.getElementById('deckModalTitle').textContent=edit?'Edit deck':'Create deck';document.getElementById('deckName').value=edit?current().name:'';document.getElementById('coverFile').value='';document.getElementById('deckModal').classList.add('open')}function closeDeckModal(){document.getElementById('deckModal').classList.remove('open')}
function fileData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)})}
async function backup(obj,filename){const blob=new Blob([JSON.stringify(obj)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000);toast('Backup file created. Check Downloads or Files.')}
function safeFile(s){return s.replace(/[^a-z0-9-_]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()||'deck'}
async function importBackup(file){try{const data=JSON.parse(await file.text());let incoming;if(data.type==='random-deck-backup'&&data.version===1){incoming=data.decks}else if(Array.isArray(data)){incoming=data}else if(data.id&&Array.isArray(data.cards)){incoming=[data]}else throw new Error('This file is not a recognized Random Deck backup.');if(!Array.isArray(incoming)||!incoming.length)throw new Error('Backup contains no decks.');const cleaned=incoming.map(d=>({id:id(),name:String(d.name||'Imported deck'),cover:d.cover||null,cardBack:d.cardBack||null,cards:(d.cards||[]).map(c=>({id:id(),image:c.image,name:c.name||'',description:c.description||''}))}));if(cleaned.some(d=>d.cards.some(c=>!c.image)))throw new Error('Some cards are missing image data.');decks.push(...cleaned);await save();renderHome();toast(`${cleaned.length} deck${cleaned.length===1?'':'s'} imported`)}catch(e){alert('Import failed: '+e.message)}}
// UI handlers
 document.getElementById('newDeck').onclick=()=>openDeckModal();document.getElementById('closeDeckModal').onclick=closeDeckModal;document.getElementById('cancelDeck').onclick=closeDeckModal;
document.getElementById('saveDeck').onclick=async()=>{try{const name=document.getElementById('deckName').value.trim();if(!name){toast('Please enter a deck name');return}const f=document.getElementById('coverFile').files[0];const cover=f?await fileData(f):null;if(editingId){const d=current();d.name=name;if(cover)d.cover=cover}else decks.push({id:id(),name,cover,cards:[]});await save();closeDeckModal();renderHome();if(editingId)renderDeck();toast('Deck saved')}catch(e){alert('Could not save deck: '+e.message)}};
document.getElementById('homeBtn').onclick=()=>{renderHome();showScreen('home')};document.getElementById('editDeck').onclick=()=>openDeckModal(true);document.getElementById('deleteDeck').onclick=async()=>{if(confirm(`Delete "${current().name}" and all its cards?`)){decks=decks.filter(d=>d.id!==currentId);await save();renderHome();showScreen('home')}};document.getElementById('duplicateDeck').onclick=async()=>{const d=current();decks.push({id:id(),name:d.name+' (copy)',cover:d.cover,cards:d.cards.map(c=>({...c,id:id()}))});await save();renderHome();toast('Deck duplicated')};document.getElementById('backupDeck').onclick=()=>backup({type:'random-deck-backup',version:1,decks:[current()]},safeFile(current().name)+'-backup.json');
document.getElementById('uploadCardBack').onclick=()=>document.getElementById('cardBackFile').click();document.getElementById('cardBackFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{current().cardBack=await fileData(f);await save();backCard();toast('Custom card back saved')}catch(err){alert('Could not upload card back: '+err.message)}e.target.value=''};document.getElementById('removeCardBack').onclick=async()=>{if(!current())return;current().cardBack=null;await save();backCard();toast('Card back removed')};
document.getElementById('manageCards').onclick=()=>{renderCardList();document.getElementById('cardsModal').classList.add('open')};document.getElementById('closeCards').onclick=()=>document.getElementById('cardsModal').classList.remove('open');document.getElementById('doneCards').onclick=()=>{document.getElementById('cardsModal').classList.remove('open');renderDeck()};document.getElementById('cardFiles').onchange=async e=>{const files=[...e.target.files];try{for(const f of files){const img=await fileData(f);current().cards.push({id:id(),image:img,name:f.name.replace(/\.[^.]+$/,''),description:''})}await save();renderCardList();renderDeck();toast(`${files.length} card image${files.length===1?'':'s'} added`)}catch(err){alert('Could not add images: '+err.message)}e.target.value=''};
function renderCardList(){const d=current(),list=document.getElementById('cardList');list.innerHTML='';if(!d.cards.length){list.innerHTML='<div class="empty">No cards yet. Upload images above.</div>';return}d.cards.forEach(card=>{const m=document.createElement('div');m.className='mini';const img=document.createElement('img');img.src=card.image;const body=document.createElement('div');body.className='mini-body';const title=document.createElement('input');title.placeholder='Card title (optional)';title.value=card.name||'';const desc=document.createElement('textarea');desc.placeholder='Description (optional)';desc.value=card.description||'';const actions=document.createElement('div');actions.className='mini-actions';const saveBtn=document.createElement('button');saveBtn.textContent='Save';saveBtn.className='secondary';saveBtn.onclick=async()=>{card.name=title.value;card.description=desc.value;await save();toast('Card updated')};const del=document.createElement('button');del.textContent='Delete';del.className='danger';del.onclick=async()=>{if(confirm('Delete this card?')){d.cards=d.cards.filter(c=>c.id!==card.id);drawnIds=drawnIds.filter(x=>x!==card.id);await save();renderCardList();renderDeck()}};actions.append(saveBtn,del);body.append(title,desc,actions);m.append(img,body);list.append(m)})}
document.getElementById('closeViewer').onclick=()=>document.getElementById('cardViewer').classList.remove('open');document.getElementById('cardViewer').onclick=e=>{if(e.target.id==='cardViewer')e.currentTarget.classList.remove('open')};document.getElementById('draw1').onclick=()=>draw(1);document.getElementById('draw3').onclick=()=>draw(3);document.getElementById('draw5').onclick=()=>draw(5);document.getElementById('drawCustom').onclick=()=>{const n=parseInt(document.getElementById('customAmount').value,10);if(!n||n<1){toast('Enter a number greater than zero');return}draw(n)};document.getElementById('resetDraw').onclick=()=>{drawnIds=[];history=[];const stage=document.getElementById('drawStage'),card=document.getElementById('drawCard'),results=document.getElementById('drawResults');results.innerHTML='';stage.classList.remove('hidden');backCard();renderDeck();toast('Deck shuffled and display reset')};document.getElementById('noRepeat').onchange=renderDeck;
document.getElementById('backupAll').onclick=()=>backup({type:'random-deck-backup',version:1,decks},'random-deck-all-backup.json');document.getElementById('exportAll').onclick=()=>backup({type:'random-deck-backup',version:1,decks},'random-deck-export.json');document.getElementById('importAll').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{if(e.target.files[0])await importBackup(e.target.files[0]);e.target.value=''};
load();
</script></body></html>
